spring.application.name=Supermarket

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SuperMarket_DB;encrypt=false;
spring.datasource.username=Damsen
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace
# Explicitly set the Hibernate Dialect for MS SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect