<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Invoice Form'">Invoice Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2ecc71;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #f9f9f9;
            --dark: #2c3e50;
            --gray: #95a5a6;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            background-color: #f5f7fa;
            min-height: 100vh;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin: 20px;
            min-height: calc(100vh - 40px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .form-header {
            background: var(--light);
            color: var(--dark);
            border-radius: 20px 20px 0 0;
            padding: 2rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
            padding: 2rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 0.75rem 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }

        .form-select {
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 0.75rem 1rem;
            transition: var(--transition);
        }

        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-primary:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
        }

        .btn-outline-secondary {
            border: 1px solid var(--gray);
            color: var(--dark);
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-outline-secondary:hover {
            background: var(--light);
            border-color: var(--dark);
        }

        .invalid-feedback {
            color: var(--accent);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
<div class="form-container">
    <!-- Header -->
    <div class="form-header">
        <div class="row align-items-center">
            <div class="col">
                <h1 class="h2 mb-2"><i class="fas fa-file-invoice me-3"></i><span th:text="${mainTitle}">Create New Invoice</span></h1>
                <p class="mb-0 text-muted">Fill in the invoice details below</p>
            </div>
            <div class="col-auto">
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <div class="container-fluid px-4 pb-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card">

                    <form th:action="@{/invoice/save}" th:object="${invoice}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row g-4">
                            <div class="col-md-6">
                                <label for="orderId" class="form-label">
                                    <i class="fas fa-hashtag me-2"></i>Order ID
                                </label>
                                <input type="text" id="orderId" th:field="*{orderId}" required
                                       class="form-control" placeholder="Enter order ID">
                                <div th:if="${#fields.hasErrors('orderId')}"
                                     th:errors="*{orderId}"
                                     class="invalid-feedback d-block"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="customerName" class="form-label">
                                    <i class="fas fa-user me-2"></i>Customer Name
                                </label>
                                <input type="text" id="customerName" th:field="*{customerName}" required
                                       class="form-control" placeholder="Enter customer name">
                                <div th:if="${#fields.hasErrors('customerName')}"
                                     th:errors="*{customerName}"
                                     class="invalid-feedback d-block"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="amount" class="form-label">
                                    <i class="fas fa-dollar-sign me-2"></i>Amount (LKR)
                                </label>
                                <input type="number" id="amount" th:field="*{amount}" required step="0.01"
                                       class="form-control" placeholder="0.00">
                            </div>

                            <div class="col-md-6">
                                <label for="status" class="form-label">
                                    <i class="fas fa-info-circle me-2"></i>Status
                                </label>
                                <select id="status" th:field="*{status}" required class="form-select">
                                    <option value="Pending">Pending</option>
                                    <option value="Paid">Paid</option>
                                    <option value="Canceled">Canceled</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="date" class="form-label">
                                    <i class="fas fa-calendar me-2"></i>Invoice Date
                                </label>
                                <input type="date" id="date" th:field="*{date}" required class="form-control">
                            </div>
                        </div>

                        <div class="mt-4 d-flex justify-content-end gap-3">
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>
                                <span th:text="${invoice.id == null} ? 'Create Invoice' : 'Save Changes'">Create Invoice</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
